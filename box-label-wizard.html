<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Label Wizard</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('fonts/fonts.css'); /* P1-4: self-hosted IBM Plex (was Google Fonts CDN) */
  :root{--panel-bg:#1a1f2e;--panel-surface:#242938;--panel-border:#343a52;--accent:#4ade80;--text-primary:#e8eaf0;--text-secondary:#8b90a8;--input-bg:#2d3347;--input-border:#404660;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--panel-bg);color:var(--text-primary);display:flex;height:100vh;overflow:hidden;}

  /* ── SIDEBAR ── */
  #sidebar{width:270px;min-width:270px;background:var(--panel-surface);border-right:1px solid var(--panel-border);display:flex;flex-direction:column;overflow-y:auto;}
  #sidebar-header{padding:18px 18px 14px;border-bottom:1px solid var(--panel-border);}
  .breadcrumb-link{font-size:11px;font-family:'IBM Plex Mono',monospace;margin-bottom:10px;display:block}.breadcrumb-link a{color:var(--accent);text-decoration:none}.breadcrumb-link a:hover{text-decoration:underline}
  .logo{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);}
  .logo h1{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}
  #sidebar-header p{font-size:11px;color:var(--text-secondary);font-family:'IBM Plex Mono',monospace;}
  .form-section{padding:14px 18px;border-bottom:1px solid var(--panel-border);}
  .form-section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px;}
  .field{margin-bottom:10px;}.field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .field input[type=text]{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:4px;color:var(--text-primary);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 9px;outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,222,128,.1);}
  #logo-upload-row{display:flex;gap:6px;}
  #btn-logo-upload{flex:1;padding:7px 9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:4px;color:var(--text-primary);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;transition:border-color .15s;}
  #btn-logo-upload:hover{border-color:var(--accent);}
  #btn-logo-reset{padding:7px 9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:4px;color:var(--text-secondary);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;display:none;}
  #btn-logo-reset:hover{color:var(--text-primary);border-color:var(--accent);}
  #logo-filename{font-size:10px;color:var(--text-secondary);margin-top:5px;font-family:'IBM Plex Mono',monospace;word-break:break-all;}
  #logo-upload-error{font-size:10px;color:#f87171;margin-top:5px;font-family:'IBM Plex Mono',monospace;display:none;}
  #sidebar-footer{padding:14px 18px;margin-top:auto;}
  #json-actions{display:flex;gap:6px;margin-bottom:9px;}
  #btn-save-json,#btn-load-json{flex:1;padding:8px 6px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:5px;color:var(--text-primary);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;transition:border-color .15s;}
  #btn-save-json:hover,#btn-load-json:hover{border-color:var(--accent);}
  #json-load-error{font-size:10px;color:#f87171;margin-bottom:9px;font-family:'IBM Plex Mono',monospace;display:none;}
  #btn-print{width:100%;padding:9px;background:var(--accent);color:#0d1117;border:none;border-radius:5px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;letter-spacing:.04em;cursor:pointer;transition:background .15s,transform .1s;}
  #btn-print:hover{background:#86efac;transform:translateY(-1px);}
  .print-note{font-size:10px;color:var(--text-secondary);text-align:center;margin-top:6px;font-family:'IBM Plex Mono',monospace;}
  .print-warn{color:#f87171;}

  /* ── PREVIEW ── */
  #preview-pane{flex:1;overflow:auto;background:#2a2a35;padding:28px;display:flex;flex-direction:column;align-items:center;}
  #preview-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:18px;font-family:'IBM Plex Mono',monospace;}

  /* ── LABEL PAGE: landscape 11" x 8.5" ── */
  /* Avery 5168: 5.005"W x 3.51"H, top/left 0.49", v-gap 0.49", h-gap 0" */
  #label-page{
    background:white;
    width:11in;
    height:8.5in;
    padding:0.49in 0 0 0.49in;
    display:grid;
    grid-template-columns:repeat(2, 5.005in);
    grid-template-rows:repeat(2, 3.51in);
    column-gap:0;
    row-gap:0.49in;
    box-shadow:0 4px 40px rgba(0,0,0,.5);
    flex-shrink:0;
  }

  /* ── INDIVIDUAL LABEL ── */
  .box-label{
    width:5.005in;
    height:3.51in;
    padding:0.2in 0.25in 0.18in 0.2in;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:white;
  }

  /* Header: logo left, project info right */
  .lbl-header{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:0.18in;
    margin-bottom:0.14in;
  }
  .lbl-logo-img{
    width:1.35in;
    height:auto;
    flex-shrink:0;
  }
  .lbl-logo-placeholder{
    width:1.35in;
    height:0.75in;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#eceff3;
    border:1px dashed #b7c0cc;
    border-radius:3px;
    color:#8b93a1;
    font-family:Arial,Helvetica,sans-serif;
    font-size:9pt;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.3;
    padding:0 0.06in;
  }
  .lbl-project-info{
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .lbl-proj-name{
    font-family:Arial,Helvetica,sans-serif;
    font-size:16pt;
    font-weight:bold;
    color:#000;
    line-height:1.6;
  }
  .lbl-proj-num{
    font-family:Arial,Helvetica,sans-serif;
    font-size:16pt;
    font-weight:normal;
    color:#000;
    line-height:1.6;
  }

  /* Separator */
  .lbl-sep{
    border:none;
    border-top:1pt solid #999;
    margin-bottom:0.1in;
  }

  /* All form rows */
  .lbl-form{
    display:flex;
    flex-direction:column;
    gap:0.09in;
    flex:1;
    justify-content:space-evenly;
  }

  /* A single form row: label text + underline fill */
  .form-row{
    display:flex;
    flex-direction:row;
    gap:0.12in;
    align-items:flex-end;
  }
  .form-item{
    display:flex;
    flex-direction:row;
    align-items:flex-end;
    flex:1;
    gap:0;
  }
  .form-item .fi-label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:12pt;
    color:#000;
    white-space:nowrap;
    line-height:1.3;
    padding-right:3pt;
  }
  .form-item .fi-line{
    flex:1;
    border-bottom:1pt solid #000;
    height:1.3em;
  }
  /* Inspector row gets less flex weight than boring rows */
  .form-row.inspector .form-item:first-child{ flex:1.4; }
  .form-row.inspector .form-item:last-child{ flex:1; }
  .form-row.boring .form-item:first-child{ flex:1.4; }
  .form-row.boring .form-item:last-child{ flex:1; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <div class="breadcrumb-link"><a href="index.html">← Geotech Tools</a> / Box Label Wizard</div>
    <div class="logo"><div class="logo-dot"></div><h1>Box Label Wizard</h1></div>
    <p>RK&amp;K Field Sampling</p>
  </div>
  <div class="form-section">
    <div class="form-section-label">Project Info</div>
    <div class="field"><label>Project Name</label><input type="text" id="projName" placeholder="e.g. Conway Road"></div>
    <div class="field"><label>Project Number</label><input type="text" id="projNum" placeholder="e.g. 23195 or 12345.678"></div>
  </div>
  <div class="form-section">
    <div class="form-section-label">Logo</div>
    <div class="field">
      <div id="logo-upload-row">
        <button id="btn-logo-upload" type="button">↑ Upload logo image</button>
        <button id="btn-logo-reset" type="button" title="Revert to default logo">✕</button>
      </div>
      <input type="file" id="logo-file-input" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" style="display:none">
      <div id="logo-filename"></div>
      <div id="logo-upload-error"></div>
    </div>
  </div>
  <div id="sidebar-footer">
    <div id="json-actions">
      <button id="btn-save-json" type="button">↓ Save JSON</button>
      <button id="btn-load-json" type="button">↑ Load JSON</button>
    </div>
    <input type="file" id="json-file-input" accept=".json" style="display:none">
    <div id="json-load-error"></div>
    <button id="btn-print">Print Labels</button>
    <div class="print-note">Avery 5168 · landscape · 4/sheet</div>
    <div class="print-note">Margins = None · Orientation = Landscape</div>
  </div>
</aside>

<main id="preview-pane">
  <div id="preview-title">Print Preview — Avery 5168</div>
  <div id="label-page"></div>
</main>

<script>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// User-uploaded logo (data URL). No logo is shown until one is uploaded.
let customLogoSrc = null;

function buildLabel(name, num){
  const n = esc(name || 'Project Name');
  const p = esc(num  || '_ _ _ _ _');
  const logoHtml = customLogoSrc
    ? `<img class="lbl-logo-img" src="${customLogoSrc}" alt="Logo">`
    : `<div class="lbl-logo-placeholder">Upload Image</div>`;
  return `
    <div class="box-label">
      <div class="lbl-header">
        ${logoHtml}
        <div class="lbl-project-info">
          <div class="lbl-proj-name">${n}</div>
          <div class="lbl-proj-num">Project&nbsp;#&nbsp;${p}</div>
        </div>
      </div>
      <hr class="lbl-sep">
      <div class="lbl-form">
        <div class="form-row inspector">
          <div class="form-item">
            <span class="fi-label">Inspector:</span><span class="fi-line"></span>
          </div>
          <div class="form-item">
            <span class="fi-label">Date:</span><span class="fi-line"></span>
          </div>
        </div>
        <div class="form-row boring">
          <div class="form-item"><span class="fi-label">Boring ID:</span><span class="fi-line"></span></div>
          <div class="form-item"><span class="fi-label">Sample IDs:</span><span class="fi-line"></span></div>
        </div>
        <div class="form-row boring">
          <div class="form-item"><span class="fi-label">Boring ID:</span><span class="fi-line"></span></div>
          <div class="form-item"><span class="fi-label">Sample IDs:</span><span class="fi-line"></span></div>
        </div>
        <div class="form-row boring">
          <div class="form-item"><span class="fi-label">Boring ID:</span><span class="fi-line"></span></div>
          <div class="form-item"><span class="fi-label">Sample IDs:</span><span class="fi-line"></span></div>
        </div>
        <div class="form-row boring">
          <div class="form-item"><span class="fi-label">Boring ID:</span><span class="fi-line"></span></div>
          <div class="form-item"><span class="fi-label">Sample IDs:</span><span class="fi-line"></span></div>
        </div>
      </div>
    </div>`;
}

function render(){
  const n = document.getElementById('projName').value.trim();
  const p = document.getElementById('projNum').value.trim();
  let h = '';
  for(let i=0;i<4;i++) h += buildLabel(n, p);
  document.getElementById('label-page').innerHTML = h;
}

document.getElementById('projName').addEventListener('input', render);
document.getElementById('projNum').addEventListener('input', render);
document.getElementById('btn-print').addEventListener('click', () => window.print());

// ── Custom logo upload ──
const ALLOWED_LOGO_TYPES = ['image/png','image/jpeg','image/gif','image/webp','image/svg+xml'];
const MAX_LOGO_BYTES = 3 * 1024 * 1024; // 3MB
const logoFileInput = document.getElementById('logo-file-input');
const logoFilenameEl = document.getElementById('logo-filename');
const logoErrorEl = document.getElementById('logo-upload-error');
const btnLogoReset = document.getElementById('btn-logo-reset');

function showLogoError(msg){
  logoErrorEl.textContent = msg;
  logoErrorEl.style.display = 'block';
}
function clearLogoError(){
  logoErrorEl.textContent = '';
  logoErrorEl.style.display = 'none';
}

let customLogoName = null;

function applyCustomLogo(dataUrl, filename){
  customLogoSrc = dataUrl;
  customLogoName = filename || null;
  logoFilenameEl.textContent = customLogoName || '';
  btnLogoReset.style.display = dataUrl ? 'inline-block' : 'none';
}

document.getElementById('btn-logo-upload').addEventListener('click', () => logoFileInput.click());

logoFileInput.addEventListener('change', (event) => {
  clearLogoError();
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  if(!ALLOWED_LOGO_TYPES.includes(file.type)){
    showLogoError('Unsupported file type. Use PNG, JPG, GIF, WEBP, or SVG.');
    logoFileInput.value = '';
    return;
  }
  if(file.size > MAX_LOGO_BYTES){
    showLogoError('Image too large (max 3MB).');
    logoFileInput.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    try{
      applyCustomLogo(reader.result, file.name);
      render();
    }catch(err){
      showLogoError('Could not load that image.');
    }
  };
  reader.onerror = () => showLogoError('Could not read that file.');
  reader.readAsDataURL(file);
});

btnLogoReset.addEventListener('click', () => {
  logoFileInput.value = '';
  applyCustomLogo(null, null);
  clearLogoError();
  render();
});

// ── Save / Load JSON ──
const SCHEMA_VERSION = 1;
const LOGO_DATA_URL_RE = /^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/;
const jsonFileInput = document.getElementById('json-file-input');
const jsonLoadErrorEl = document.getElementById('json-load-error');

function showJsonLoadError(msg){
  jsonLoadErrorEl.textContent = msg;
  jsonLoadErrorEl.style.display = 'block';
}
function clearJsonLoadError(){
  jsonLoadErrorEl.textContent = '';
  jsonLoadErrorEl.style.display = 'none';
}

function saveJSON(){
  try{
    const state = {
      schemaVersion: SCHEMA_VERSION,
      projName: document.getElementById('projName').value,
      projNum: document.getElementById('projNum').value,
      customLogoSrc: customLogoSrc || null,
      customLogoName: customLogoName || null
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const slug = (state.projNum || state.projName || 'box-label-wizard')
      .trim().replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') || 'box-label-wizard';
    a.href = url;
    a.download = `${slug}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    alert('Could not save the JSON file: ' + err.message);
  }
}

function loadJSON(event){
  clearJsonLoadError();
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try{
      const raw = JSON.parse(reader.result);

      if(typeof raw.schemaVersion === 'number' && raw.schemaVersion > SCHEMA_VERSION){
        showJsonLoadError('This file was saved by a newer version of the wizard and can\'t be loaded here.');
        jsonFileInput.value = '';
        return;
      }

      // Whitelist-rebuild: only pull known keys, coerce types, drop everything else.
      const projName = typeof raw.projName === 'string' ? raw.projName : '';
      const projNum  = typeof raw.projNum  === 'string' ? raw.projNum  : '';
      let logoSrc  = typeof raw.customLogoSrc  === 'string' ? raw.customLogoSrc  : null;
      let logoName = typeof raw.customLogoName === 'string' ? raw.customLogoName : null;
      if(logoSrc && !LOGO_DATA_URL_RE.test(logoSrc)){
        logoSrc = null;
        logoName = null;
      }

      document.getElementById('projName').value = projName;
      document.getElementById('projNum').value = projNum;
      applyCustomLogo(logoSrc, logoName);
      clearLogoError();
      render();
    }catch(err){
      showJsonLoadError('That file isn\'t a valid Box Label Wizard JSON export.');
    }finally{
      jsonFileInput.value = '';
    }
  };
  reader.onerror = () => {
    showJsonLoadError('Could not read that file.');
    jsonFileInput.value = '';
  };
  reader.readAsText(file);
}

document.getElementById('btn-save-json').addEventListener('click', saveJSON);
document.getElementById('btn-load-json').addEventListener('click', () => jsonFileInput.click());
jsonFileInput.addEventListener('change', loadJSON);

render();
</script>

<style>
@media print{
  @page{size:11in 8.5in landscape;margin:0;}
  body{display:block!important;height:auto!important;overflow:visible!important;background:white!important;}
  #sidebar{display:none!important;}
  #preview-pane{display:block!important;padding:0!important;background:white!important;overflow:visible!important;}
  #preview-title{display:none!important;}
  #label-page{
    box-shadow:none!important;
    width:11in!important;
    height:8.5in!important;
    padding:0.49in 0 0 0.49in!important;
  }
  .box-label{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
}
</style>
<script>
// P1-3: every tool registers the service worker so the whole suite
// gets pre-cached for offline use no matter which page is opened first.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('Geotech Tools: service worker registered'))
    .catch(e => console.warn('Geotech Tools: SW registration failed', e));
}
</script>
</body>
</html>
